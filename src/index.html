<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="./anime-favicon.png" />

    <title>Anime Finder</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./main.css" />
  </head>

  <body>
    <main>
      <div id="maininfo">
        <header>
          <h1>Anime Finder</h1>
        </header>

        <div id="menuitems">
          <input
            id="searchterm"
            type="text"
            size="20"
            maxlength="20"
            placeholder="Search..."
          />

          <button id="gobutton">Go</button>

          <div class="break"></div>

          <button id="clearbutton">Clear</button>

          <div class="break"></div>

          <button id="generatebutton">Generate Random Anime</button>
        </div>
      </div>

      <div id="status">No data yet!</div>

      <div id="content"></div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
